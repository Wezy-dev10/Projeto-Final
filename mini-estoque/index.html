<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mini Estoque</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <h1>Mini Estoque</h1>

  <!-- Formulário para adicionar ou editar produto -->
  <h2>Adicionar produto</h2>
  <div class="formulario">
    <input type="text" id="nome" placeholder="Nome do produto">
    <input type="text" id="categoria" placeholder="Categoria">
    <input type="number" id="quantidade" placeholder="Quantidade">
    <input type="number" id="preco" placeholder="Preço" step="0.01">
    <button id="botao-adicionar" onclick="salvarProduto()">Adicionar</button>
  </div>

  <!-- Campo de pesquisa -->
  <h2>Produtos</h2>
  <input type="text" id="pesquisa" placeholder="Pesquisar pelo nome..." oninput="mostrarProdutos()">

  <!-- Tabela de produtos -->
  <table>
    <thead>
      <tr>
        <th>Nome</th>
        <th>Categoria</th>
        <th>Quantidade</th>
        <th>Preço</th>
        <th>Ações</th>
      </tr>
    </thead>
    <tbody id="lista-produtos">
      <!-- As linhas são criadas pelo JavaScript -->
    </tbody>
  </table>

  <script src="js/script.js"></script>
</body>
</html>
